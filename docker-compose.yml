version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: adventure_tour_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: adventure_tours
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d adventure_tours"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: adventure_tour_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/adventure_tours
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"

volumes:
  postgres_data:
